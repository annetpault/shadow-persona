<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      font-family: Arial, sans-serif;
      padding: 14px;
      margin: 0;
      background-color: #f7f9fc;
    }
    h3 {
      margin-top: 0;
      color: #1e293b;
      font-size: 15px;
    }
    .badge {
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .safe { background: #dcfce7; color: #166534; }
    .warning { background: #fee2e2; color: #991b1b; }
    p { font-size: 13px; margin: 4px 0; color: #475569; }
    b { color: #0f172a; }
    
    /* Persona Card Styles */
    .persona-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      margin-top: 12px;
    }
    .persona-field {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
    }
    .persona-val {
      font-family: monospace;
      color: #0f172a;
      font-weight: bold;
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 9px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background-color: #1d4ed8; }
    .btn-secondary {
      background-color: #64748b;
      margin-top: 4px;
    }
    .btn-secondary:hover { background-color: #475569; }
  </style>
</head>
<body>
  <h3>🛡️ Shadow Persona</h3>
  <div id="status" class="badge">Scanning...</div>
  <p>Total input fields: <b id="total">-</b></p>
  <p>Hidden fields: <b id="hidden">-</b></p>
  <p>Invisible traps: <b id="traps">-</b></p>

  <div class="persona-card">
    <div class="persona-field">Name: <span id="mock-name" class="persona-val">---</span></div>
    <div class="persona-field">Username: <span id="mock-user" class="persona-val">---</span></div>
    <div class="persona-field">Password: <span id="mock-pass" class="persona-val">---</span></div>
    <button id="btn-fill">⚡ Autofill Page</button>
    <button id="btn-regen" class="btn-secondary">🔄 Reroll Identity</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
