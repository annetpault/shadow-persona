<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shadow Persona</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    body {
      width: 340px;
      background: linear-gradient(180deg, #0d121f 0%, #090d16 100%);
      color: #f8fafc;
      padding: 16px;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 12px;
      width: 100%;
      justify-content: center;
    }

    .badge.warning {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
    }

    .badge.safe {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #34d399;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 11px;
    }

    .card-row:not(:last-child) {
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .label {
      color: #64748b;
      font-weight: 500;
    }

    .val {
      color: #e2e8f0;
      font-weight: 600;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .val-mono {
      font-family: 'JetBrains Mono', monospace;
      color: #38bdf8;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      padding: 9px 10px;
      border-radius: 9px;
      border: 1px solid transparent;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-primary {
      width: 100%;
      background: #2563eb;
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      margin-bottom: 8px;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-subtle {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border-color: rgba(255, 255, 255, 0.06);
    }

    .btn-subtle:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #fff;
    }

    .btn-emerald {
      width: 100%;
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.25);
      margin-bottom: 12px;
    }

    .btn-emerald:hover {
      background: rgba(16, 185, 129, 0.2);
    }

    .section-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clear-link {
      color: #ef4444;
      text-decoration: none;
      font-size: 10px;
      cursor: pointer;
    }

    #mail-list {
      margin-top: 6px;
      font-size: 11px;
      color: #94a3b8;
    }

    #vault-list {
      max-height: 140px;
      overflow-y: auto;
      margin-top: 6px;
    }

    #vault-list::-webkit-scrollbar { width: 4px; }
    #vault-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }

    .vault-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      font-size: 11px;
    }

    .btn-vault-fill:hover {
      background: #1d4ed8 !important;
    }

    .btn-del-item:hover {
      background: rgba(239, 68, 68, 0.35) !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <span>🛡️</span> Shadow Persona
    </div>
  </div>

  <div id="status" class="badge safe">
    ✅ Ready
  </div>

  <div class="card">
    <div class="card-row">
      <span class="label">Name</span>
      <span class="val" id="mock-name">Loading...</span>
    </div>
    <div class="card-row">
      <span class="label">Email</span>
      <span class="val" id="mock-email" style="color: #60a5fa;">Loading...</span>
    </div>
    <div class="card-row">
      <span class="label">Password</span>
      <span class="val val-mono" id="mock-pass">••••••••</span>
    </div>
  </div>

  <button class="btn-primary" id="btn-fill">
    ⚡ Autofill Page
  </button>

  <div class="btn-grid">
    <button class="btn-subtle" id="btn-regen">
      🔄 Reroll Identity
    </button>
    <button class="btn-subtle" id="btn-bypass">
      🔓 Bypass Wall
    </button>
  </div>

  <button class="btn-emerald" id="btn-save-vault">
    🔒 Save to Encrypted Vault
  </button>

  <div style="border-top: 1px solid rgba(255,255,255,0.06); padding-top: 10px; margin-bottom: 10px;">
    <div class="section-title">Verification Code</div>
    <button class="btn-subtle" id="btn-check-mail" style="width: 100%;">
      📬 Check Inbox
    </button>
    <div id="mail-list"></div>
  </div>

  <div style="border-top: 1px solid rgba(255,255,255,0.06); padding-top: 10px;">
    <div class="section-title">
      <span>Encrypted Vault (AES-256)</span>
      <span class="clear-link" id="btn-clear-vault">Clear</span>
    </div>
    <div id="vault-list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
